[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hinglish-toolbench"
version = "0.1.0"
description = "A Hinglish tool-calling benchmark, a label-first synthetic data pipeline, and a small distilled model that runs offline."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Rehan Chouhan" }]
dependencies = ["pydantic>=2.6", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
htb = "htb.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]
